auth_enabled: false
server:
  http_listen_port: 3100

ingester:
  wal:
    enabled: true
    dir: /var/loki/wal

schema_config:
  configs:
    - from: 2023-01-01
      store: boltdb
      object_store: filesystem
      schema: v11
      index:
        prefix: loki_index_
        period: 24h

storage_config:
  boltdb:
    directory: /var/loki/index
  filesystem:
    directory: /var/loki/chunks
