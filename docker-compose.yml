version: "3.9"
services:
  kafka:
    image: bitnami/kafka:3.6.1
    container_name: kafka
    ports:
      - 9092:9092
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true     
      - KAFKA_KRAFT_CLUSTER_ID=JxCkUVApSFS5USd2Ay03Vw
      - ALLOW_PLAINTEXT_LISTENER=yes
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-setup:
    image: bitnami/kafka:3.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: |
      bash -e -c '
        TOPICS="movie-events user-events payment-events"

        echo "🟡  ждём готовности брокера…"
        until kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
          sleep 1
        done

        echo "🟢  создаём топики (если отсутствуют)…"
        for topic in $$TOPICS; do
          kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists \
            --topic "$$topic" --partitions 1 --replication-factor 1 || true
        done

        echo "⏳  ждём назначения лидеров…"
        for topic in $$TOPICS; do
          printf "   → %s: " "$$topic"
          while true; do
            leader=$$(kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic "$$topic" 2>/dev/null \
                      | grep -E "Partition: *0" \
                      | sed -E "s/.*Leader: ([0-9-]+).*/\1/")
            if [ -n "$$leader" ] && [ "$$leader" != "-1" ]; then
              echo "лидер $$leader готов"; break
            fi
            sleep 1
          done
        done

        echo "🎉  все топики готовы, kafka-setup завершается."
      '



  kafka-ui:
    image: provectuslabs/kafka-ui:latest     
    container_name: kafka-ui
    ports:
      - "8083:8080"                          
    depends_on:
      - kafka                                
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092

  event-service:
    build:
      context: ./src/microservices/events
      dockerfile:  Dockerfile
    container_name: event-service
    ports:
      - "8082:8082"
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      mongo:
        condition: service_started
    environment:
      - CLIENT_ID=node-events-app
      - GROUP_ID=node-events-group
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC_MOVIE=movie-events
      - KAFKA_TOPIC_USER=user-events
      - KAFKA_TOPIC_PAYMENT=payment-events
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=eventsdb
      - PORT=8082

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  movie-service:
    build:
      context: ./src/microservices/movies
      dockerfile: Dockerfile
    depends_on:
      postgres-micro:
        condition: service_healthy
      proxy-service:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_CONNECTION_STRING: postgres://postgres:postgres_password@postgres-micro:5432/microcinema?sslmode=disable
    networks:
      - cinemaabyss-network
  postgres-micro:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: microcinema
    ports:
      - "5433:5432"
    volumes:
      - postgres-data-micro:/var/lib/postgresql/data
      - ./src/database-micro:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinemaabyss-network

  proxy-service:
    build:
      context: ./src/microservices/proxy
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - kafka       
      - monolith
    environment:
      PORT: 8080           
      KAFKA_BROKERS: kafka:9092
      KAFKA_INPUT_TOPIC: bff-requests
      MONOLITH_URL: http://cinemaabyss-monolith:8099
      MOVIES_URL: http://movie-service:8081
      GRADUAL_MIGRATION: "true"
      MOVIES_MIGRATION_PERCENT: "50"
    networks:
      - cinemaabyss-network
  
  postgres:
    image: postgres:14
    container_name: cinemaabyss-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: cinemaabyss
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinemaabyss-network
  
  monolith:
    build:
      context: ./src/monolith
      dockerfile: Dockerfile
    container_name: cinemaabyss-monolith
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8099:8099"
    environment:
      PORT: 8099
      DB_CONNECTION_STRING: postgres://postgres:postgres_password@postgres:5432/cinemaabyss?sslmode=disable
    networks:
      - cinemaabyss-network

volumes:
  postgres-data:
  postgres-data-micro:
  grafana-storage:
  keycloak_db_data:
  loki:
  mongo_data:

networks:
  cinemaabyss-network:
    name: cinemaabyss-network
    driver: bridge