version: "3.9"
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports: ["80:80"]                       
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx-exporter
    command: [ "-nginx.scrape-uri=http://nginx/nginx_status" ]
    depends_on: [nginx]
    ports: ["9113:9113"]
  
  go-mobile-bff:
    build:
      context: ./src/microservices/bff-mobile-go-service
      dockerfile: Dockerfile
    container_name: go-mobile-bff
    environment:
      - SERVICE_NAME=go-mobile-bff
      - PORT=8082
    ports:
      - "8082:8080" 


  ###########################################################################
  # 2) Prometheus
  ###########################################################################
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  ###########################################################################
  # 3) Loki (хранит логи) + Promtail (собирает логи всех контейнеров)
  ###########################################################################
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
    - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    - ./loki/data:/var/loki
    ports: ["3100:3100"]

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro   # читаем логи Docker
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [loki]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports: ["3000:3000"]
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  kafka:
    image: bitnami/kafka:3.6.1
    container_name: kafka
    ports:
      - 9092:9092
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_KRAFT_CLUSTER_ID=JxCkUVApSFS5USd2Ay03Vw
      - ALLOW_PLAINTEXT_LISTENER=yes
    command:
      - bash
      - -c
      - |
        /opt/bitnami/scripts/kafka/run.sh &

        echo "Waiting for Kafka to start..."
        sleep 10

        echo "Creating required topics..."
        topics="movie-events user-events payment-events"

        for topic in $$topics; do
          if [ -n "$$topic" ]; then
            echo "Creating topic: $$topic"
            kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
          fi
        done
        wait
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest     
    container_name: kafka-ui
    ports:
      - "8083:8080"                          
    depends_on:
      - kafka                                
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092

  keycloak-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_started
    command:
      - start-dev             
      - --import-realm 
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8090:8080"       
  event-service:
    build:
      context: ./src/microservices/events
      dockerfile:  Dockerfile
    container_name: event-service
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_started
    environment:
      - CLIENT_ID=node-events-app
      - GROUP_ID=node-events-group
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC_MOVIE=movie-events
      - KAFKA_TOPIC_USER=user-events
      - KAFKA_TOPIC_PAYMENT=payment-events
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=eventsdb
      - PORT=8082

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  movie-service:
    build:
      context: ./src/microservices/movies
      dockerfile: Dockerfile
    depends_on:
      postgres-micro:
        condition: service_healthy
      proxy-service:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_CONNECTION_STRING: postgres://postgres:postgres_password@postgres-micro:5432/microcinema?sslmode=disable
    networks:
      - cinemaabyss-network
  postgres-micro:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: microcinema
    ports:
      - "5433:5432"
    volumes:
      - postgres-data-micro:/var/lib/postgresql/data
      - ./src/database-micro:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinemaabyss-network

  proxy-service:
    build:
      context: ./src/microservices/proxy
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - kafka       
      - monolith
    environment:
      PORT: 8080           
      KAFKA_BROKERS: kafka:9092
      KAFKA_INPUT_TOPIC: bff-requests
      MONOLITH_URL: http://cinemaabyss-monolith:8099
      MOVIES_URL: http://movie-service:8081
      GRADUAL_MIGRATION: "true"
      MOVIES_MIGRATION_PERCENT: "50"
    networks:
      - cinemaabyss-network
  
  postgres:
    image: postgres:14
    container_name: cinemaabyss-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: cinemaabyss
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinemaabyss-network
  
  monolith:
    build:
      context: ./src/monolith
      dockerfile: Dockerfile
    container_name: cinemaabyss-monolith
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8099:8099"
    environment:
      PORT: 8099
      DB_CONNECTION_STRING: postgres://postgres:postgres_password@postgres:5432/cinemaabyss?sslmode=disable
    networks:
      - cinemaabyss-network

volumes:
  postgres-data:
  postgres-data-micro:
  grafana-storage:
  keycloak_db_data:
  loki:
  mongo_data:

networks:
  cinemaabyss-network:
    name: cinemaabyss-network
    driver: bridge