global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Если Go-сервисы отображают /metrics (например, через Prometheus client),
  # добавьте их порты. 2112 — пример.
  - job_name: go-services
    static_configs:
      - targets:
          - "web-service:2112"
          - "mobile-service:2112"
          - "tv-service:2112"

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
